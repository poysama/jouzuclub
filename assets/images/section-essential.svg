<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#202138"/>
    </linearGradient>
  </defs>
  <rect width="800" height="80" fill="url(#bg)"/>
  <!-- Stacked books motif -->
  <g transform="translate(690, 20)" opacity="0.18">
    <rect x="0" y="35" width="40" height="8" rx="1" fill="#d4a76a"/>
    <rect x="-3" y="25" width="46" height="8" rx="1" fill="#e8836b"/>
    <rect x="2" y="15" width="36" height="8" rx="1" fill="#9898b0"/>
    <rect x="-1" y="5" width="42" height="8" rx="1" fill="#d4a76a"/>
  </g>
  <!-- Open book -->
  <g transform="translate(740, 28)" opacity="0.12">
    <path d="M0 25 Q10 18 20 25" stroke="#e8e6f0" stroke-width="1" fill="none"/>
