    <line x1="0" y1="25" x2="0" y2="45" stroke="#e8e6f0" stroke-width="0.5"/>
    <line x1="40" y1="25" x2="40" y2="45" stroke="#e8e6f0" stroke-width="0.5"/>
    <line x1="20" y1="18" x2="20" y2="45" stroke="#e8e6f0" stroke-width="0.5"/>
  </g>
  <path d="M0 75 Q40 68 80 75 Q120 68 160 75 Q200 68 240 75 Q280 68 320 75 Q360 68 400 75 Q440 68 480 75 Q520 68 560 75 Q600 68 640 75 Q680 68 720 75 Q760 68 800 75" fill="none" stroke="#d4a76a" stroke-width="0.5" opacity="0.2"/>
